HTML

<script>
/* --- 1. ZONE DE COLLAGE DU CHÂTEAU --- */
const imageChateauBase64 = "TON_CODE_BASE64_DU_CHATEAU_LIGNE_6_ICI";

/* --- 2. ZONE DE COLLAGE DU FOND --- */
const imageFondBase64 = "TON_CODE_BASE64_DU_FOND_LIGNE_10_ICI";
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: #222; overflow: hidden; }
        #background-layer { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; }
        #chateau-layer { position: absolute; width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 2; pointer-events: none; }
        #path-svg { position: absolute; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        
        /* FIX CARRÉ BLANC : On force la transparence ici */
        #delorean-container { position: absolute; z-index: 500; transition: all 0.35s linear; width: 100px; height: 50px; transform: translate(-50%, -50%); background: transparent !important; border: none !important; }
        #delorean { width: 100%; height: 100%; background: url('joueur.png') no-repeat center/contain !important; background-color: transparent !important; filter: drop-shadow(0 8px 6px rgba(0,0,0,0.6)); }

        .tile { position: absolute; width: 44px; height: 32px; border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 10px; transform-origin: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background-layer"></div>
        <div id="chateau-layer"></div>
        <svg id="path-svg"></svg>
        <div id="delorean-container"><div id="delorean"></div></div>
    </div>

    <div id="popup-fin-tour" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(20, 20, 20, 0.95); color:white; padding:30px; border:3px solid #8a2be2; border-radius:15px; text-align:center; z-index:9999; box-shadow: 0 0 30px #8a2be2; font-family: sans-serif;">
        <h2 style="color:#a855f7; margin-top:0;">CHRONOS DRIFT</h2>
        <p id="popup-message" style="font-size:1.3em;">Analyse en cours...</p>
        <button onclick="document.getElementById('popup-fin-tour').style.display='none'" style="background:#8a2be2; color:white; border:none; padding:12px 25px; border-radius:10px; cursor:pointer; font-weight:bold; font-size:1.1em;">CONTINUER</button>
    </div>

<script>
// --- RÉTABLISSEMENT DU MOTEUR COMPLET ---
let car = { index: 0, vitesse: 2, x: 0, y: 0 };
let destination = 0;
let valeurDe = 0;

function moteurJeuDeLoie() {
    destination = valeurDe * 150;
    if (car.index < destination) { car.index += car.vitesse; }
    
    // CAPTEUR : Déclenche le message
    if (Math.abs(car.index - destination) < 15 && document.getElementById('popup-fin-tour').style.display === 'none' && destination > 0) {
        afficherPopup(car.index);
    }

    if (typeof points !== 'undefined' && points[Math.floor(car.index)]) {
        let p = points[Math.floor(car.index)];
        const container = document.getElementById('delorean-container');
        container.style.left = p.x + 'px';
        container.style.top = p.y + 'px';
    }
    requestAnimationFrame(moteurJeuDeLoie);
}

function afficherPopup(indexPiste) {
    const caseNumero = Math.floor(indexPiste / 150) + 1;
    document.getElementById('popup-message').innerText = "Nom d'un bolide, tu es maintenant sur la case " + caseNumero;
    document.getElementById('popup-fin-tour').style.display = 'block';
}

// Chargement des images
document.getElementById('background-layer').style.backgroundImage = `url(${imageFondBase64})`;
document.getElementById('chateau-layer').style.backgroundImage = `url(${imageChateauBase64})`;

moteurJeuDeLoie();
</script>
</body>
</html>
